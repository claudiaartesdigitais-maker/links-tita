<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links e Catálogos - Tita</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            margin: 0; 
            padding: 10px 10px; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #ffffff; 
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        
        .header {
            text-align: center;
            margin-bottom: 12px;
        }

        .header p {
            color: #e65100;
            font-size: 18px; 
            font-weight: bold;
            margin: 0;
        }

        .btn-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            width: 100%;
            max-width: 500px;
        }

        .btn {
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 12px 5px; 
            color: #ffffff !important; 
            text-decoration: none !important;
            border-radius: 12px; 
            font-weight: 900; /* Extra negrito */
            font-size: 18px; /* FONTE AUMENTADA PARA 18px */
            text-align: center;
            background: linear-gradient(135deg, #ff9800, #e65100);
            border: none;
            min-height: 65px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .btn i { 
            font-size: 20px; 
            margin-right: 10px;
        }

        /* AJUSTE DO BOTÃO TUPPERWARE PARA FICAR CENTRALIZADO E GRANDE */
        #tupperware {
            grid-column: span 2; /* Ocupa as duas colunas */
            width: 100%;
        }

        .btn:active { 
            transform: scale(0.95); 
        }
    </style>
</head>
<body>

    <div class="header">
        <p>Catálogos e Lojas Virtuais</p>
    </div>

    <div class="btn-container">
        <a href="#" id="minha-loja-online" class="btn"><i class="fas fa-shopping-bag"></i> Loja</a>
        <a href="#" id="catalogos-multimarcas" class="btn"><i class="fas fa-book-open"></i> Catálogos</a>
        <a href="#" id="cartao-visitas" class="btn"><i class="fas fa-address-card"></i> Cartão de Visita</a>
        <a href="#" id="natura" class="btn"><i class="fas fa-leaf"></i> Natura</a>
        <a href="#" id="natura-exclusiva" class="btn"><i class="fas fa-spa"></i> Exclusiva</a>
        <a href="#" id="avon-beleza" class="btn"><i class="fas fa-magic"></i> Avon</a>
        <a href="#" id="avon-casa" class="btn"><i class="fas fa-home"></i> Casa</a>
        <a href="#" id="demillus" class="btn"><i class="fas fa-female"></i> DeMillus</a>
        <a href="#" id="tupperware" class="btn"><i class="fas fa-utensils"></i> Tupperware</a>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJUuIB5dNERXB_74PlkvgqG-Eq3zbpprNhAUGb7E0uHvuj1QCNOEGOvqiOHl9jLGXRJ-c_BEPL0iu0/pub?gid=0&single=true&output=csv';

        async function loadLinks() {
            try {
                const response = await fetch(`${CSV_URL}&t=${Date.now()}`);
                const data = await response.text();
                const rows = data.split(/\r?\n/).filter(row => row.trim() !== "");

                rows.forEach(row => {
                    let cols = row.split(/[;,]/);
                    if (cols.length >= 2) {
                        const idDaPlanilha = cols[0].replace(/"/g, '').trim().toLowerCase();
                        const urlDaPlanilha = cols[1].replace(/"/g, '').trim();
                        const botaoElemento = document.getElementById(idDaPlanilha);
                        
                        if (botaoElemento && urlDaPlanilha.toLowerCase().startsWith('http')) {
                            botaoElemento.href = urlDaPlanilha;
                            botaoElemento.target = "_blank"; 
                        }
                    }
                });
            } catch (err) {
                console.error("Erro ao carregar links:", err);
            }
        }
        loadLinks();
    </script>
</body>
</html>

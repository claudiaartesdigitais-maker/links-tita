<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links e Catálogos - Tita</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            margin: 0; 
            padding: 30px 10px; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #ffffff; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .header {
            text-align: center;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .header p {
            color: #e65100;
            font-size: 20px; 
            font-weight: bold;
            margin: 0;
            line-height: 1.2;
        }

        /* MUDANÇA PARA 2 COLUNAS AQUI */
        .btn-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; /* Cria as duas colunas iguais */
            gap: 12px; 
            width: 100%;
            max-width: 500px; /* Aumentado levemente para caber os dois */
        }

        .btn {
            display: flex; 
            flex-direction: column; /* Ícone em cima do texto para economizar espaço lateral */
            align-items: center; 
            justify-content: center;
            padding: 15px 10px; 
            color: #ffffff !important; 
            text-decoration: none !important;
            border-radius: 15px; 
            font-weight: bold; 
            font-size: 14px; /* Diminuído para caber na coluna */
            text-align: center;
            box-shadow: 0 4px 10px rgba(230, 81, 0, 0.2);
            background: linear-gradient(135deg, #ff9800, #e65100);
            transition: transform 0.2s;
            border: none;
            min-height: 90px; /* Garante que todos tenham o mesmo tamanho */
        }

        .btn i { 
            margin-right: 0; /* Remove a margem lateral antiga */
            margin-bottom: 8px; /* Espaço entre ícone e texto */
            width: auto; 
            font-size: 24px; 
        }

        /* Faz os dois primeiros botões ocuparem a linha inteira (Opcional) */
        /* Se quiser que todos sejam 2 colunas, apague as linhas abaixo */
        #minha-loja-online, #catalogos-multimarcas {
            grid-column: span 1; 
        }

        .btn:active { 
            transform: scale(0.95); 
        }

        .scroll-indicator {
            margin-top: 25px;
            color: #ff9800;
            font-size: 24px;
            animation: bounce 2s infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.6;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-8px);}
            60% {transform: translateY(-4px);}
        }
    </style>
</head>
<body>

    <div class="header">
        <p>Acesse meus catálogos e lojas virtuais</p>
    </div>

    <div class="btn-container">
        <a href="#" id="minha-loja-online" class="btn"><i class="fas fa-shopping-bag"></i> Loja Online</a>
        <a href="#" id="catalogos-multimarcas" class="btn"><i class="fas fa-book-open"></i> Catálogos</a>
        <a href="#" id="cartao-visitas" class="btn"><i class="fas fa-address-card"></i> Cartão</a>
        <a href="#" id="natura" class="btn"><i class="fas fa-leaf"></i> Natura</a>
        <a href="#" id="natura-exclusiva" class="btn"><i class="fas fa-spa"></i> Natura Excl.</a>
        <a href="#" id="avon-beleza" class="btn"><i class="fas fa-magic"></i> Avon Beleza</a>
        <a href="#" id="avon-casa" class="btn"><i class="fas fa-home"></i> Avon Casa</a>
        <a href="#" id="demillus" class="btn"><i class="fas fa-female"></i> DeMillus</a>
        <a href="#" id="tupperware" class="btn"><i class="fas fa-utensils"></i> Tupperware</a>
    </div>

    <div class="scroll-indicator">
        <i class="fas fa-chevron-down"></i>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJUuIB5dNERXB_74PlkvgqG-Eq3zbpprNhAUGb7E0uHvuj1QCNOEGOvqiOHl9jLGXRJ-c_BEPL0iu0/pub?gid=0&single=true&output=csv';

        async function loadLinks() {
            try {
                const response = await fetch(`${CSV_URL}&t=${Date.now()}`);
                const data = await response.text();
                const rows = data.split(/\r?\n/).filter(row => row.trim() !== "");

                rows.forEach(row => {
                    let cols = row.split(/[;,]/);
                    if (cols.length >= 2) {
                        const idDaPlanilha = cols[0].replace(/"/g, '').trim().toLowerCase();
                        const urlDaPlanilha = cols[1].replace(/"/g, '').trim();
                        const botaoElemento = document.getElementById(idDaPlanilha);
                        
                        if (botaoElemento && urlDaPlanilha.toLowerCase().startsWith('http')) {
                            botaoElemento.href = urlDaPlanilha;
                            botaoElemento.target = "_blank"; 
                        }
                    }
                });
            } catch (err) {
                console.error("Erro ao carregar links:", err);
            }
        }
        loadLinks();
    </script>
</body>
</html>
